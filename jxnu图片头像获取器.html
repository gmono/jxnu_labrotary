<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>jxnu图片获取器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <nav class="navbar navbar-inverse navbar-fixed-top">
            <div class="container">
                <div class="navbar-header">
                <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="#">JXNU图片查询器</a>
                </div>
                <div id="navbar" class="collapse navbar-collapse">
                <ul class="nav navbar-nav">
                    <li group="nav" id="tag_content" class="active"><a href="#content" active="tag_content">查询</a></li>
                    <li group="nav" id="tag_crawl"><a href="#crawl" active="tag_crawl">爬取</a></li>
                    <li group="nav" id="tag_about"><a href="#about" active="tag_about">关于本程序</a></li>
                </ul>
                </div><!--/.nav-collapse -->
            </div>
    </nav>

    <div class="container page" id="content">
        <div class="row">
            <div class="col-md-3 col-sm-3 col-xs-3"></div>
            <div class="col-md-5">
                <img id="show" src="http://jwc.jxnu.edu.cn/TeacherPhotos/003555.jpg?a=20190430003353" alt="查无此人">
            </div>
            <div class="col-md-3">
                <form>
                        <div class="form-group">
                            <label for="userid">用户ID：</label>
                            <input class="form-control" type="text" name="userid" id="userid">        
                        </div>
                        <div class="form-group">
                            <label for="usertype">用户类型</label>
                            <select class="form-control" name="usertype" id="usertype">
                                <option value="Student">学生</option>
                                <option value="Teacher">老师</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button id="query" type="button" class="btn btn-primary ">查询</button>
                            <button type="reset" class="btn btn-default">清空</button>
                        </div>

                        
                </form>
            </div>
        </div>
        <div class="row" style="height:50px;"></div>
        
    </div>
    <div class="container page" id="crawl">
            
    </div>
    <div class="container page" id="about">
        <p class="lead">
            JXNU图片获取器
        </p>
        <p>
            用于在选课时查看<mark>老师头像</mark>或在平时查看<mark>同学头像</mark>等，或进行头像抓取，
            <em>针对课程的老师同学信息/头像获取等</em>
            
        </p>
        <p>
            后续将加入使用在线API的根据简介选老师和根据颜值选老师功能
            以及 根据班级平均性别比例和平均颜值选班级功能
        </p>
    
    <!-- jQuery (Bootstrap 的所有 JavaScript 插件都依赖 jQuery，所以必须放在前边) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
    <!-- 加载 Bootstrap 的所有 JavaScript 插件。你也可以根据需要只加载单个插件。 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
    <script>
        let querybtn=$("#query");
        let showimg=$("#show");
        let userid=()=>$("#userid").val();
        let usertype=()=>$("#usertype").val();
        //type:Student Teacher 
        function getsrc(id,type)
        {
            let src=`http://jwc.jxnu.edu.cn/MyControl/All_PhotoShow.aspx?UserNum=${id.trim()}&UserType=${type.trim()}`;
            return src;
        }
        querybtn.click((e)=>{
            showimg.attr("src",getsrc(userid(),usertype()))
        });

        //active
        let pairs= $("*[active]").map((i,ele)=>new Object({ele:ele,target:$(ele).attr("active")}));
        pairs.each((i,pair)=>{
            $(pair.ele).click((e)=>{
                let target=$(`#${pair.target}`);
                let group=target.attr("group");
                //去除其他的active
                if(group!=null)
                    $(`[group=${group}]`).removeClass();
                if(target.hasClass("active"))
                    target.removeClass("active");
                else target.addClass("active");
            });
        });
        console.log(pairs);
    </script>
    <style>

        #show
        {
            margin:0 auto;
        }
        .page
        {
            display:none;
            margin:0 auto;
            margin-top: 100px;
        }

        .page:target
        {
            display:block;
        }
        
    </style>

</body>
</html>
