<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>组件化测试程序</title>
    <!-- jQuery (Bootstrap 的所有 JavaScript 插件都依赖 jQuery，所以必须放在前边) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
</head>
<body>
    <script>
        //组件化基本程序
        function loadPage(root,text)
        {
            root.innerHTML=text;
            let pagefunc=window.page;
            pagefunc({$:$(root),window,document});
        }
        async function loadFile(selector,url)
        {
            let ele=$(selector)[0];
            let res=await fetch(url);
            if(res.ok)
            {
                let text=await res.text();
                window.nowLoading=url;
                loadPage(ele,text);
            }
        }
    </script>

</body>
</html>
